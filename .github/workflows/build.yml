name: Build Magisk XuanYi

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Manual Submodule Clone
        run: |
          set -e
          clone_sm() {
            rm -rf "$1"
            mkdir -p "$(dirname "$1")"
            git clone --depth 1 "$2" "$1"
            echo "[OK] $1"
          }
          clone_sm native/src/external/selinux https://github.com/topjohnwu/selinux.git
          clone_sm native/src/external/lz4 https://github.com/lz4/lz4.git
          clone_sm native/src/external/libcxx https://github.com/topjohnwu/libcxx.git
          clone_sm native/src/external/cxx-rs https://github.com/topjohnwu/cxx.git
          clone_sm native/src/external/lsplt https://github.com/LSPosed/LSPlt.git
          clone_sm native/src/external/system_properties https://github.com/topjohnwu/system_properties.git
          clone_sm native/src/external/crt0 https://github.com/topjohnwu/crt0.git
          test -f native/src/external/cxx-rs/Cargo.toml && echo "cxx-rs OK"
          test -d native/src/external/lz4/lib && echo "lz4 OK"

      - uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Download NDK
        run: ./build.py ndk

      - name: Build Release
        run: ./build.py -r all

      - name: Commit APK
        run: |
          mkdir -p release
          APK=$(ls out/*.apk | head -1)
          cp "$APK" release/magisk-xuanyi.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f release/magisk-xuanyi.apk
          git commit -m "Update APK [skip ci]" || echo "no change"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-xuanyi
          path: out/*.apk
